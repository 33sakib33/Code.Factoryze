name: Build release installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-2022
            artifact: windows
          - os: ubuntu-24.04
            artifact: linux
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag matches desktop package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          app_version="$(node -p "require('./packages/app/package.json').version")"
          test "$RELEASE_TAG" = "v$app_version" || {
            echo "Tag $RELEASE_TAG does not match desktop package version $app_version" >&2
            exit 1
          }
      - name: Select OpenSSL 3 for macOS checks
        if: runner.os == 'macOS'
        shell: bash
        run: |
          lab_openssl="$(brew --prefix openssl@3)/bin/openssl"
          test -x "$lab_openssl"
          echo "FACTORYZE_OPENSSL=$lab_openssl" >> "$GITHUB_ENV"
      - name: Select Git OpenSSL for Windows checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $labOpenSsl = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
          if (!(Test-Path -LiteralPath $labOpenSsl)) { throw 'OpenSSL 3 is required for lab certificate tests' }
          "FACTORYZE_OPENSSL=$labOpenSsl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux build and smoke prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev xvfb libsecret-1-dev dbus-x11 gnome-keyring openssl rpm cpio
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:app
      - name: Package installer
        run: pnpm --filter @factoryze/app package:installer
        env:
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm --filter @factoryze/app verify:package
      - name: Smoke-test installer
        if: runner.os != 'Linux'
        run: pnpm --filter @factoryze/app smoke:installer
      - name: Smoke-test installer with isolated Linux keyring
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail <<'SH'
          factoryze_keyring_dir="$(mktemp -d)"
          export XDG_DATA_HOME="$factoryze_keyring_dir"
          trap 'rm -rf "$factoryze_keyring_dir"' EXIT
          printf '%s' 'synthetic-smoke-keyring' | gnome-keyring-daemon --unlock --components=secrets > /dev/null
          for factoryze_format in AppImage deb rpm; do
            FACTORYZE_LINUX_INSTALLER="$factoryze_format" xvfb-run -a pnpm --filter @factoryze/app smoke:installer
          done
          SH
      - uses: actions/upload-artifact@v4
        with:
          name: factoryze-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Attach installers to draft release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: factoryze-*
          path: release-files
          merge-multiple: true
      - name: Create checksums
        run: cd release-files && sha256sum * > SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-files/* --draft --generate-notes --title "$RELEASE_TAG"
