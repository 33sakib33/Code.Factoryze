schema: 1
id: activity-feed
title: Activity feed
brief: >
  Northstar's project activity feed shows the right entries, but pages with many
  different contributors become slow as the team grows. The support team can
  reproduce it even when only the latest 100 entries are requested. Improve the
  feed without changing its contents, order, workspace boundaries or how former
  members appear. A member's new display name must appear on the next request.
minimumPython: "3.11"
entryFile: feed/feed.py
timeHintMinutes: 35
budgetTokens: 30000
